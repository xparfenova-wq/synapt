<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">принципы 1 и 2 из 6</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">2 / 7</text>
<text x="90" y="427.73" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">01</text>
<text x="196" y="427.73" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Сначала проводим анализ, потом</text>
<text x="196" y="490.13" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">определяем стоимость</text>
<text x="196" y="552.52" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">и критерии</text>
<text x="196" y="610.91" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">Первый Zoom – погружение в запрос. Затем</text>
<text x="196" y="659.5" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">анализ, форматы сотрудничества и критерии</text>
<text x="196" y="708.09" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">приёмки в договоре</text>
<text x="90" y="840.69" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">02</text>
<text x="196" y="840.69" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Работаем быстро и итеративно</text>
<text x="196" y="899.08" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">Первый результат через 3-5 недель. Каждую</text>
<text x="196" y="947.67" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">неделю показываем прогресс</text>
</svg>
