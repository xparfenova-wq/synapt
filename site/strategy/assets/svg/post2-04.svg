<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">принципы 5 и 6 из 6</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">4 / 7</text>
<text x="90" y="490.13" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">05</text>
<text x="196" y="490.13" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">60 дней на связи после сдачи</text>
<text x="196" y="548.52" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">Обкатываем систему на реальной работе</text>
<text x="196" y="597.11" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">и донастраиваем под новые сценарии</text>
<text x="90" y="729.7" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">06</text>
<text x="196" y="729.7" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Берёмся только за то, что умеем</text>
<text x="196" y="788.09" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">AI-агенты, интеграции, веб и мобильная</text>
<text x="196" y="836.69" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">разработка. Если задача решается</text>
<text x="196" y="885.28" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">процессом и AI не нужен – скажем</text>
</svg>
