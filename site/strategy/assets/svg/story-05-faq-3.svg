<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#0E1211"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">частый вопрос</text>
<text x="90" y="712.7" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">Мы уже внедряли,</text>
<text x="90" y="803" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">эффекта не было?</text>
<text x="90" y="909.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">Так бывает, когда инструмент дают</text>
<text x="90" y="980.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">людям без разбора процесса:</text>
<text x="90" y="1051.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">инструкция есть, привычки нет.</text>
<text x="90" y="1122.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">Мы начинаем с процессов и задач</text>
<text x="90" y="1193.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">конкретных людей, а инструмент</text>
<text x="90" y="1264.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">подбираем под них</text>
</svg>
