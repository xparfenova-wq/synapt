<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">не нашли свою задачу</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">6 / 7</text>
<text x="90" y="378.23" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">Список блоков –</text>
<text x="90" y="466.42" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">частые запросы,</text>
<text x="90" y="554.61" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">не весь возможный</text>
<text x="90" y="642.8" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">набор</text>
<text x="90" y="746.98" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">Если процесс повторяется и по нему</text>
<text x="90" y="815.14" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">есть данные, соберём под него</text>
<text x="90" y="883.3" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">решение. Задача больше блока – SaaS,</text>
<text x="90" y="951.45" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">приложение, внутренняя система –</text>
<text x="90" y="1019.61" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">возьмём целиком</text>
</svg>
