<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#0E1211"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">подход</text>
<text x="90" y="506.22" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">Шесть принципов,</text>
<text x="90" y="585.41" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">по которым работаем</text>
<text x="90" y="664.59" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">над каждым проектом</text>
<text x="90" y="767.78" font-family="JetBrains Mono" font-size="44" font-weight="500" letter-spacing="0.88" fill="#D0E865">01</text>
<text x="212" y="767.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">Сначала проводим анализ,</text>
<text x="212" y="832.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">потом определяем стоимость</text>
<text x="212" y="897.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">и критерии</text>
<text x="90" y="1010.78" font-family="JetBrains Mono" font-size="44" font-weight="500" letter-spacing="0.88" fill="#D0E865">02</text>
<text x="212" y="1010.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">Работаем быстро и итеративно</text>
<text x="90" y="1123.78" font-family="JetBrains Mono" font-size="44" font-weight="500" letter-spacing="0.88" fill="#D0E865">03</text>
<text x="212" y="1123.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">Система остаётся у вас целиком</text>
<text x="90" y="1236.78" font-family="JetBrains Mono" font-size="44" font-weight="500" letter-spacing="0.88" fill="#D0E865">04</text>
<text x="212" y="1236.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">Данные не покидают ваш контур</text>
<text x="90" y="1349.78" font-family="JetBrains Mono" font-size="44" font-weight="500" letter-spacing="0.88" fill="#D0E865">05</text>
<text x="212" y="1349.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">60 дней на связи после сдачи</text>
<text x="90" y="1462.78" font-family="JetBrains Mono" font-size="44" font-weight="500" letter-spacing="0.88" fill="#D0E865">06</text>
<text x="212" y="1462.78" font-family="Manrope" font-size="50" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF">Берёмся только за то, что умеем</text>
</svg>
