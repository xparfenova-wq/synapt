<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">кейс, b2c-сервис</text>
<text x="90" y="534.47" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#9AA5A1">Коммерческий продукт, участие</text>
<text x="90" y="592.47" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#9AA5A1">в разработке</text>
<text x="90" y="723.47" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">Юридический</text>
<text x="90" y="813.77" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">консультант отвечает</text>
