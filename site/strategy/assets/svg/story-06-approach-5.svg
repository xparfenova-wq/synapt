<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#0E1211"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">подход, 5 из 6</text>
<text x="90" y="712.7" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">60 дней на связи</text>
<text x="90" y="803" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">после сдачи</text>
<text x="90" y="909.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">В первые недели обкатываем систему</text>
<text x="90" y="980.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">на работе, и если что-то идёт не так,</text>
<text x="90" y="1051.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">правим. Заодно быстро</text>
<text x="90" y="1122.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">донастраиваем под нагрузку и новые</text>
<text x="90" y="1193.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">сценарии, которые появляются</text>
<text x="90" y="1264.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">по ходу</text>
</svg>
