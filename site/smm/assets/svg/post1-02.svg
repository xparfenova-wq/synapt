<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">почему мы</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">2 / 7</text>
<text x="90" y="398.45" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">Объединяем компанию с AI</text>
<text x="90" y="475.45" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">и ускоряем прогресс</text>
<text x="90" y="579.45" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">Синапс – место, где сигнал переходит</text>
<text x="90" y="647.61" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">от одного нейрона к следующему,</text>
<text x="90" y="715.77" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">и из таких точек собрана любая</text>
<text x="90" y="783.92" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">нейросеть. Для того же работает наша</text>
<text x="90" y="852.08" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">команда: приходим в компанию</text>
<text x="90" y="920.23" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">и соединяем её процессы и людей</text>
<text x="90" y="988.39" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">с новыми технологиями</text>
