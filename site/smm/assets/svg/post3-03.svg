<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">как проходит</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">3 / 7</text>
<text x="90" y="412.31" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">Три Zoom</text>
<text x="90" y="500.5" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">за две недели, между</text>
<text x="90" y="588.69" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">ними разбираем</text>
<text x="90" y="676.88" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">работу</text>
<text x="90" y="781.06" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">От вас нужны до 6 часов, доступ</text>
<text x="90" y="849.22" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">к рабочим инструментам и один-два</text>
<text x="90" y="917.38" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">человека, к которым можно обратиться</text>
<text x="90" y="985.53" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">с вопросами</text>
