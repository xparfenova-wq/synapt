<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#0E1211"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">шаг 3 из 3</text>
<text x="90" y="548.66" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">AI-система,</text>
<text x="90" y="638.95" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">усиливающая</text>
<text x="90" y="729.25" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">и ускоряющая бизнес</text>
<text x="90" y="835.55" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">Система разрабатывается из блоков.</text>
<text x="90" y="906.55" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">Какие именно нужны вам, показывают</text>
<text x="90" y="977.55" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">AI-чекап и AI-десант</text>
<text x="90" y="1128.55" font-family="JetBrains Mono" font-size="110" font-weight="500" letter-spacing="-3.3" fill="#FFFFFF">3-5 недель</text>
<text x="90" y="1203.55" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="0.44" fill="#9AA5A1">до готового продукта</text>
<text x="90" y="1355.94" font-family="JetBrains Mono" font-size="110" font-weight="500" letter-spacing="-3.3" fill="#FFFFFF">60 дней</text>
<text x="90" y="1430.94" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="0.44" fill="#9AA5A1">на связи после завершения</text>
</svg>
