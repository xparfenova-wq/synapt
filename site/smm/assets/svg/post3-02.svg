<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">принципы 1 и 2 из 6</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">2 / 7</text>
<text x="90" y="354.84" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">01</text>
<text x="196" y="354.84" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Сначала проводим анализ, только</text>
<text x="196" y="417.23" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">потом определяем стоимость</text>
<text x="196" y="479.63" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">и критерии</text>
<text x="196" y="538.02" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">Первый Zoom – погружение в запрос</text>
<text x="196" y="586.61" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">и контекст. Затем внутренний анализ,</text>
<text x="196" y="635.2" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">форматы сотрудничества на выбор и чёткие</text>
<text x="196" y="683.8" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">критерии приёмки в договоре</text>
<text x="90" y="816.39" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">02</text>
<text x="196" y="816.39" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Работаем быстро и итеративно</text>
<text x="196" y="874.78" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">Первый результат отдаём команде</text>
<text x="196" y="923.38" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">через 3-5 недель. Каждую неделю</text>
<text x="196" y="971.97" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">показываем прогресс и дорабатываем</text>
<text x="196" y="1020.56" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">по обратной связи</text>
</svg>
