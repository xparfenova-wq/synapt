<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">когда нужен чекап</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">2 / 7</text>
<rect x="90" y="360.06" width="5" height="132.47" fill="#D0E865"/>
<text x="139" y="411.06" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Менеджеры до сих пор вручную</text>
<text x="139" y="477.3" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">обрабатывают и оформляют заявки</text>
<rect x="90" y="536.53" width="5" height="198.7" fill="#D0E865"/>
<text x="139" y="587.53" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Купили команде курс за сто</text>
<text x="139" y="653.77" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">восемьдесят тысяч, посмотрели два</text>
<text x="139" y="720" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">урока и вернулись к прежней работе</text>
<rect x="90" y="779.23" width="5" height="198.7" fill="#D0E865"/>
<text x="139" y="830.23" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Я вижу выручку, но не вижу общую</text>
<text x="139" y="896.47" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">картину: как менеджеры ведут</text>
<text x="139" y="962.7" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">коммуникацию с клиентами</text>
</svg>
