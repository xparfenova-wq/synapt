<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#0E1211"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">миссия</text>
<text x="90" y="660.94" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">Мы хотим, чтобы после</text>
<text x="90" y="740.13" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">нас задачи решались</text>
<text x="90" y="819.31" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">быстрее, показатели</text>
<text x="90" y="898.5" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">росли, а люди занимались</text>
<text x="90" y="977.69" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">тем, что двигает</text>
<text x="90" y="1056.88" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">их и бизнес вперёд</text>
<text x="90" y="1163.06" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">Каждая такая связка помогает</text>
<text x="90" y="1234.06" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">эволюционировать не только</text>
<text x="90" y="1305.06" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">компании, но и человечеству</text>
</svg>
