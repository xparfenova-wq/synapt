<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#0E1211"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">частый вопрос</text>
<text x="90" y="606.31" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">Что будет с командой</text>
<text x="90" y="685.5" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">после интеграции AI?</text>
<text x="90" y="791.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">До старта вместе с вами разбираем</text>
<text x="90" y="862.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">роли: что забирает агент,</text>
<text x="90" y="933.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">что остаётся за человеком</text>
<text x="90" y="1004.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">и как меняется его рабочий день.</text>
<text x="90" y="1075.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">Сокращения мы не предлагаем</text>
<text x="90" y="1146.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">и не планируем, это решение</text>
<text x="90" y="1217.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">собственника. Наша задача – снять</text>
<text x="90" y="1288.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">с людей повторяющуюся рутину,</text>
<text x="90" y="1359.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">а не отнять у них работу</text>
</svg>
