<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#0E1211"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">частый вопрос</text>
<text x="90" y="606.31" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">Что происходит после</text>
<text x="90" y="685.5" font-family="Manrope" font-size="72" font-weight="600" letter-spacing="-2.16" fill="#FFFFFF">запуска?</text>
<text x="90" y="791.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">60 дней поддержки: остаёмся</text>
<text x="90" y="862.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">на связи и обкатываем систему</text>
<text x="90" y="933.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">на реальных процессах,</text>
<text x="90" y="1004.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">донастраиваем под то, как работает</text>
<text x="90" y="1075.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">команда. Дальше продлеваем</text>
<text x="90" y="1146.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">договор или полностью передаём</text>
<text x="90" y="1217.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">систему вашей команде. Код,</text>
<text x="90" y="1288.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">документация и методология</text>
<text x="90" y="1359.69" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">в любом случае остаются у вас</text>
</svg>
