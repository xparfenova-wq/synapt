<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#151A18"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#D0E865">подход, 6 из 6</text>
<text x="90" y="783.7" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">Берёмся только за то,</text>
<text x="90" y="874" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#FFFFFF">что умеем</text>
<text x="90" y="980.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">AI-агенты, интеграции, веб</text>
<text x="90" y="1051.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">и мобильная разработка для бизнеса.</text>
<text x="90" y="1122.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">Если задача решается на уровне</text>
<text x="90" y="1193.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#C4CAC7">процесса и AI не нужен – тоже скажем</text>
</svg>
