<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">шаг 3 из 3</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">4 / 7</text>
<text x="90" y="233.73" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">AI-система,</text>
<text x="90" y="321.92" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">усиливающая</text>
<text x="90" y="410.11" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">и ускоряющая бизнес</text>
<text x="90" y="514.3" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">Система разрабатывается из блоков.</text>
<text x="90" y="582.45" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">Какие именно нужны вам, показывают</text>
<text x="90" y="650.61" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">AI-чекап и AI-десант. Они дают карту</text>
<text x="90" y="718.77" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">процессов и показывают, где команда</text>
<text x="90" y="786.92" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">теряет время</text>
<text x="90" y="915.08" font-family="JetBrains Mono" font-size="84" font-weight="500" letter-spacing="-2.52" fill="#FFFFFF">3-5 недель</text>
<text x="90" y="978.08" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="0.36" fill="#9AA5A1">до готового продукта</text>
<text x="90" y="1105.67" font-family="JetBrains Mono" font-size="84" font-weight="500" letter-spacing="-2.52" fill="#FFFFFF">60 дней</text>
<text x="90" y="1168.67" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="0.36" fill="#9AA5A1">на связи после завершения</text>
</svg>
