<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect x="0" y="0" width="1080" height="1920" rx="0" fill="#D0E865"/>
<text x="90" y="288" font-family="JetBrains Mono" font-size="44" font-weight="400" letter-spacing="2.64" fill="#3E4A1E">подход, 2 из 6</text>
<text x="90" y="783.7" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#12150A">Работаем быстро</text>
<text x="90" y="874" font-family="Manrope" font-size="86" font-weight="600" letter-spacing="-2.58" fill="#12150A">и итеративно</text>
<text x="90" y="980.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#2A3115">Первый результат отдаём команде</text>
<text x="90" y="1051.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#2A3115">через 3-5 недель. Каждую неделю</text>
<text x="90" y="1122.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#2A3115">показываем прогресс</text>
<text x="90" y="1193.3" font-family="Manrope" font-size="50" font-weight="400" letter-spacing="-0.25" fill="#2A3115">и дорабатываем по обратной связи</text>
</svg>
