<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">эффект</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">6 / 7</text>
<text x="90" y="432.34" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">Команда сама ставит</text>
<text x="90" y="520.53" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">задачи нейросети</text>
<text x="90" y="624.72" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">Сотрудники понимают,</text>
<text x="90" y="692.88" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">что и как просить, и находят новые</text>
<text x="90" y="761.03" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">применения без нас. Через месяц</text>
<text x="90" y="829.19" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">почти вся компания открывала</text>
<text x="90" y="897.34" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">нейросети без напоминаний, потому</text>
<text x="90" y="965.5" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">что так быстрее</text>
</svg>
