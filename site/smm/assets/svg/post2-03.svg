<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">шаг 2 из 3</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">3 / 7</text>
<text x="90" y="253.53" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">AI-десант и обучение</text>
<text x="90" y="341.72" font-family="Manrope" font-size="84" font-weight="600" letter-spacing="-2.52" fill="#FFFFFF">команды</text>
<text x="90" y="445.91" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">Месяц работы внутри компании:</text>
<text x="90" y="514.06" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">специалист студии встраивает</text>
<text x="90" y="582.22" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">нейросети в повседневные задачи</text>
<text x="90" y="650.38" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">каждого отдела, а курс даёт команде</text>
<text x="90" y="718.53" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">знания и кураторскую поддержку</text>
<text x="90" y="846.69" font-family="JetBrains Mono" font-size="84" font-weight="500" letter-spacing="-2.52" fill="#FFFFFF">30 дней</text>
<text x="90" y="909.69" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="0.36" fill="#9AA5A1">один специалист, полный рабочий месяц</text>
<text x="90" y="1037.28" font-family="JetBrains Mono" font-size="84" font-weight="500" letter-spacing="-2.52" fill="#FFFFFF">от 80 тыс. ₽</text>
<text x="90" y="1100.28" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="0.36" fill="#9AA5A1">месяц работы специалиста внутри вашей</text>
<text x="90" y="1148.88" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="0.36" fill="#9AA5A1">команды</text>
