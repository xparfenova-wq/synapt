<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">принципы 5 и 6 из 6</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">4 / 7</text>
<text x="90" y="320.05" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">05</text>
<text x="196" y="320.05" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">60 дней на связи после сдачи</text>
<text x="196" y="378.44" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">В первые недели обкатываем систему</text>
<text x="196" y="427.03" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">на работе, и если что-то идёт не так, правим.</text>
<text x="196" y="475.63" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">Заодно быстро донастраиваем под нагрузку</text>
<text x="196" y="524.22" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">и новые сценарии, которые появляются</text>
<text x="196" y="572.81" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">по ходу</text>
<text x="90" y="705.41" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">06</text>
<text x="196" y="705.41" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Берёмся только за то, что умеем</text>
<text x="196" y="763.8" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">AI-агенты, интеграции, веб и мобильная</text>
<text x="196" y="812.39" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">разработка для бизнеса. Игровые проекты,</text>
<text x="196" y="860.98" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">встроенное ПО и задачи, где нужна команда</text>
<text x="196" y="909.58" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">из тридцати человек, отдаём коллегам</text>
<text x="196" y="958.17" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">и говорим об этом сразу. Если задача</text>
<text x="196" y="1006.77" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">решается на уровне процесса и AI не нужен –</text>
<text x="196" y="1055.36" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">тоже скажем</text>
</svg>
