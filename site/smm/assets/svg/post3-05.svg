<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">результат</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">5 / 7</text>
<text x="90" y="260.14" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">Четыре артефакта,</text>
<text x="90" y="337.14" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">которые остаются у вас</text>
<text x="90" y="438.14" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">01</text>
<text x="196" y="438.14" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Карта всех процессов компании</text>
<text x="196" y="496.53" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">как сейчас устроена работа, где теряются</text>
<text x="196" y="545.13" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">заявки, часы и деньги</text>
<text x="90" y="649.72" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">02</text>
<text x="196" y="649.72" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Порядок внедрения</text>
<text x="196" y="708.11" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">что даёт эффект первым, что можно отложить</text>
<text x="196" y="756.7" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">и почему</text>
<text x="90" y="861.3" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">03</text>
<text x="196" y="861.3" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">План с вилкой бюджета</text>
<text x="196" y="919.69" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">сколько будет стоить внедрение по каждому</text>
<text x="196" y="968.28" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">направлению</text>
<text x="90" y="1072.88" font-family="JetBrains Mono" font-size="36" font-weight="500" letter-spacing="0.72" fill="#D0E865">04</text>
<text x="196" y="1072.88" font-family="Manrope" font-size="48" font-weight="500" letter-spacing="-0.48" fill="#FFFFFF">Собранный агент</text>
<text x="196" y="1131.27" font-family="Manrope" font-size="36" font-weight="400" fill="#9AA5A1">готовый агент под один конкретный процесс</text>
</svg>
