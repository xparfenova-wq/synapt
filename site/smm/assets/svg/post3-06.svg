<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0E1211"/>
<text x="90" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#D0E865">о сроках</text>
<text x="871.19" y="121" font-family="JetBrains Mono" font-size="36" font-weight="400" letter-spacing="2.16" fill="#6E7975">6 / 7</text>
<text x="90" y="453.34" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">Длительность этапов</text>
<text x="90" y="530.34" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">у проектов разная:</text>
<text x="90" y="607.34" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">на разбор одного хватит</text>
<text x="90" y="684.34" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">недели, а на другой может</text>
<text x="90" y="761.34" font-family="Manrope" font-size="70" font-weight="600" letter-spacing="-2.1" fill="#FFFFFF">потребоваться три</text>
<text x="90" y="865.34" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">Точные сроки и стоимость фиксируем</text>
<text x="90" y="933.5" font-family="Manrope" font-size="48" font-weight="400" letter-spacing="-0.24" fill="#C4CAC7">в спецификации после встречи</text>
</svg>
